[package]
name = "syncfony"
version = "0.1.0"
edition = "2024"
authors = ["Riky Ripaldo", "rikyripaldo@gmail.com", "DeepSeek V4.1 Flash"]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
ffmpeg-sidecar = "2.7.0"
heif-rs = "26.10.3"
hex = "0.4.3"
image = "0.25.10"
kamadak-exif = "0.6.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
surrealdb = { version = "3.3.5", features = ["kv-rocksdb"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "cors"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
